{% extends 'base.html'  %}

{% block content %}
    <div class="text-center">
        <h1>
            Client editor
        </h1>
    </div>
    <div class="active-contacts">
        <h3>
            Active clients
        </h3>
    </div>
    <form method="post" class="table_info_insert">
        <input type="text" id="deal_name" name="deal_name" placeholder="Deal name" value="{{ client.deal_name }}" >
                    <input type="text" id="client_name" name="client_name" placeholder="Client name" value="{{ client.client_name }}">
                    <input type="text" id="contacts" name="contacts" placeholder="Mobile phone or email" value="{{ client.contacts }}" >
                    <input type="number" step="0.001" id="price" name="deal_price" placeholder="Deal price" value="{{ client.deal_price }}">
                    <select id="currency" name="currency">
                        <option value="RUB"
                        {% if client.currency == "RUB" %}selected{% endif %}>
                        RUB
                        </option>
                        <option value="BYN"
                        {% if client.currency == "BYN" %}selected{% endif %}>
                        BYN
                        </option>
                        <option value="EUR"
                        {% if client.currency == "EUR" %}selected{% endif %}>
                        EUR
                        </option>
                        <option value="USD"
                        {% if client.currency == "USD" %}selected{% endif %}>
                        USD
                        </option>
                        <option value="CNY"
                        {% if client.currency == "CNY" %}selected{% endif %}>
                        CNY
                        </option>
                    </select>
                    
                    <select id="stage" name="stage">
                        <option value="Lead"
                        {% if client.stage == "Lead" %}selected{% endif %}>
                        Lead
                        </option>
                        <option value="Discussion"
                        {% if client.stage == "Discussion" %}selected{% endif %}>
                        Discussion
                        </option>
                        <option value="Contract sent"
                        {% if client.stage == "Contract sent" %}selected{% endif %}>
                        Contract sent
                        </option>
                        <option value="Won"
                        {% if client.stage == "Won" %}selected{% endif %}>
                        Won
                        </option>
                        <option value="Lost"
                        {% if client.stage == "Lost" %}selected{% endif %}>
                        Lost
                        </option>
                    </select>
                    
                    <input type="date" id="deadline" name="deadline" placeholder="Deadline" value="{{ client.deadline }}" >
        <button type="submit">Update client</button>
    </form>

{% endblock content %}
